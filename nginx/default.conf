# ============================================================
# nginx reverse proxy LOCAL — chỉ HTTP, không Cloudflare/TLS/domain.
#
#   http://localhost:3000
#     /api/teacher/*  -> backend /teacher/*   (bỏ tiền tố /api)
#     /api/admin/*    -> backend /admin/*     (bỏ tiền tố /api)
#     /api/*          -> backend /api/*
#     /media/*        -> backend /media/*
#     /gaze/*         -> gaze /*              (bỏ tiền tố /gaze, WS)
#     /*              -> frontend:3000
# ============================================================

# Chỉ nâng cấp lên WebSocket khi client thực sự yêu cầu (Upgrade header).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Upload PDF slide: khớp backend (max_pdf_bytes = 50MB).
    client_max_body_size 50m;

    # Endpoint Docker healthcheck.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # --- API: teacher/admin bỏ tiền tố /api (backend không có prefix này) ---
    location /api/teacher/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;

        # Upload PDF slide nằm trong /api/teacher/lessons/{id}/slides/upload.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/admin/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- API còn lại: giữ nguyên /api/... ---
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Media (ảnh slide) ---
    location /media/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
    }

    # --- Gaze (HTTP + WebSocket); bỏ tiền tố /gaze ---
    location /gaze/ {
        rewrite ^/gaze(/.*)$ $1 break;
        proxy_pass http://gaze:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 3600s;
    }

    # --- Còn lại: Next.js ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
