# ============================================================
# nginx reverse proxy LOCAL — chỉ HTTP, không Cloudflare/TLS/domain.
#
#   http://localhost:3000
#     /api/teacher/*  -> backend /teacher/*   (bỏ tiền tố /api)
#     /api/admin/*    -> backend /admin/*     (bỏ tiền tố /api)
#     /api/*          -> backend /api/*
#     /media/*        -> backend /media/*
#     /gaze/*         -> gaze /*              (bỏ tiền tố /gaze, WS)
#     /*              -> frontend:3000
# ============================================================

# Docker embedded DNS. Upstream dùng `resolve` để nginx tự resolve lại tên
# service sau mỗi lần container backend/frontend/gaze được recreate; nếu
# proxy_pass ghi thẳng hostname, nginx chỉ resolve một lần lúc start và giữ
# IP cũ -> 502 "Connection refused" sau khi recreate.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Cache asset tĩnh của Next.js (immutable, có hash trong tên file).
proxy_cache_path /var/cache/nginx/next_static
    levels=1:2
    keys_zone=next_static:10m
    max_size=1g
    inactive=30d
    use_temp_path=off;

# Chỉ nâng cấp lên WebSocket khi client thực sự yêu cầu (Upgrade header).
# Giá trị rỗng cho request thường để nginx giữ keepalive với upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8001 resolve max_conns=200;
    keepalive 64;
}

upstream gaze_upstream {
    zone gaze_upstream 64k;
    # Session calibration nằm trong RAM từng replica. Frontend tạo cookie
    # gaze_affinity trước request đầu; nginx giữ mọi request/WS của cùng
    # browser trên một replica. Nếu không có cookie, mọi request hash rỗng nên
    # vẫn về cùng một replica (đúng, nhưng không phân tải).
    hash $cookie_gaze_affinity;
    server gaze:8000 resolve max_conns=200;
    keepalive 32;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve max_conns=100;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Mỗi IP tối đa 50 kết nối đồng thời; đủ cho browser + SSE + media.
    limit_conn perip 50;
    limit_req_status 429;
    limit_conn_status 429;

    # Upload file nguồn (PDF/PPTX/PPT/ODP) khớp MAX_UPLOAD_BYTES của backend.
    # PDF sau convert có thể tới 100MB nhưng không đi qua request này.
    client_max_body_size 50m;

    # gzip kế thừa từ nginx.conf; SSE tắt gzip riêng bên dưới.

    # Endpoint Docker healthcheck.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # --- SSE: /api/courses/{courseId}/chat/stream ---
    # Phải đứng trước /api/ (regex location thắng prefix location).
    location ~ ^/api/courses/[^/]+/chat/stream$ {
        limit_conn perip_sse 5;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;

        # Stream token ngay khi backend ghi, không gom buffer.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Gaze batch: 30 HS sau NAT gửi 1 batch/1,5 s ---
    # Zone riêng theo browser + trần IP; không dùng api_rl 20 r/s để cả lớp
    # không chạm 429. Route backend giữ nguyên prefix /api nên không rewrite.
    location ~ ^/api/learning-sessions/[^/]+/gaze-batches$ {
        limit_req zone=gaze_batch_rl burst=20 nodelay;
        limit_req zone=gaze_batch_ip_rl burst=120 nodelay;
        limit_conn perip_gaze 150;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- API: teacher/admin bỏ tiền tố /api (backend không có prefix này) ---
    location /api/teacher/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn perip_api 30;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;

        # Upload PDF slide nằm trong /api/teacher/lessons/{id}/slides/upload.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/admin/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn perip_api 30;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /internal/ { return 404; }

    # --- Auth: giới hạn chặt hơn để chống brute-force ---
    location /api/auth/ {
        limit_req zone=auth_rl burst=10 nodelay;
        limit_conn perip_auth 20;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- API còn lại: giữ nguyên /api/... ---
    # SSE đã có location riêng ở trên; các API JSON còn lại bật buffering để
    # giảm số lần ghi socket và tăng throughput.
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn perip_api 50;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # --- Media (ảnh slide) ---
    location /media/ {
        limit_conn perip_media 20;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # --- Media nội bộ: backend kiểm tra quyền rồi trả X-Accel-Redirect ---
    # `internal` chặn truy cập trực tiếp; nginx dùng sendfile + Range.
    location /_protected_media/ {
        internal;
        alias /media/;
        add_header X-Content-Type-Options nosniff;
    }

    # --- Gaze (HTTP + WebSocket); bỏ tiền tố /gaze ---
    location /gaze/ {
        rewrite ^/gaze(/.*)$ $1 break;
        proxy_pass http://gaze_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        # Ảnh calibration/import nhỏ; chặn sớm file lớn trước khi vào service.
        client_max_body_size 6m;
        # Mỗi WS upgrade là 1 request; 20 r/s/IP đủ cho 1 tab và chặn spam
        # tạo session calibration. Burst rộng để không chặn giật cục.
        limit_req zone=api_rl burst=40 nodelay;
    }

    # --- Next.js static assets: cache mạnh ở nginx ---
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_cache next_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Còn lại: Next.js ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
