user  nginx;
# Container được cấp 2 CPU; 2 worker là đủ và tránh tranh chấp.
worker_processes 2;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Cloudflare Tunnel gửi IP thật trong CF-Connecting-IP. Chỉ tin header
    # này từ các dải mạng Docker nội bộ (cloudflared là container cùng stack).
    # Nhờ vậy rate limit/audit dùng IP người dùng, không phải IP cloudflared.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Cloudflared gửi X-Forwarded-Proto=https khi request gốc là HTTPS.
    # Local (không có header) fallback về $scheme để dev vẫn chạy HTTP.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;

    # Gaze batch sau NAT trường: key theo browser (cookie affinity) để 30 SV
    # cùng một IP không dùng chung bucket 20 r/s. Không có cookie → fallback IP.
    map $cookie_gaze_affinity $gaze_batch_key {
        ""      $binary_remote_addr;
        default $cookie_gaze_affinity;
    }

    # Giới hạn bảo vệ backend khi có burst hoặc client lỗi.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=5r/s;
    # Gaze batch: 4 r/s/browser (1 batch/1,5 s ≈ 0,67 r/s) + trần IP thô để
    # client xoay cookie không vượt được giới hạn.
    limit_req_zone $gaze_batch_key zone=gaze_batch_rl:10m rate=4r/s;
    limit_req_zone $binary_remote_addr zone=gaze_batch_ip_rl:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $binary_remote_addr zone=perip_api:10m;
    limit_conn_zone $binary_remote_addr zone=perip_auth:10m;
    limit_conn_zone $binary_remote_addr zone=perip_sse:10m;
    limit_conn_zone $binary_remote_addr zone=perip_media:10m;
    limit_conn_zone $binary_remote_addr zone=perip_gaze:10m;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Nén mặc định ở http; default.conf có thể override theo location.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
