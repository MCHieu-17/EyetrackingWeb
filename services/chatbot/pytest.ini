[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    fast: test hộp đen không gọi VLM/LLM/embedding thật
    smoke: test dùng model/LLM thật và stack đang chạy
    db: cần PostgreSQL test
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
