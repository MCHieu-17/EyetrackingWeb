x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Env dùng chung cho backend API + các worker (content-worker, worker).
# Service nào cần thêm biến riêng thì merge thêm bên dưới.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL_DOCKER}
  REDIS_URL: ${REDIS_URL_DOCKER}
  AI_HTTP_URL: http://gaze:8000
  # Chatbot RAG service (nội bộ). Backend gọi qua tên service + token.
  CHATBOT_URL: http://chatbot:8000
  CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN}
  # Ingest slide: API xếp job, embedding-worker gọi chatbot /ingest/slides.
  # Đặt ở anchor để backend và embedding-worker dùng cùng giá trị; nếu chỉ đặt
  # ở backend thì worker vẫn chạy default trong code.
  CHATBOT_TIMEOUT_SECONDS: ${CHATBOT_TIMEOUT_SECONDS:-120}
  CHATBOT_INGEST_TIMEOUT_SECONDS: ${CHATBOT_INGEST_TIMEOUT_SECONDS:-900}
  CHATBOT_INGEST_ATTEMPTS: ${CHATBOT_INGEST_ATTEMPTS:-4}
  CHATBOT_INGEST_BACKOFF_SECONDS: ${CHATBOT_INGEST_BACKOFF_SECONDS:-10}
  CHATBOT_INGEST_BATCH_SIZE: ${CHATBOT_INGEST_BATCH_SIZE:-8}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
  # Dải mạng proxy tin cậy: chỉ peer trong dải này mới được tin X-Forwarded-For
  # (nginx trong mạng docker nội bộ).
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  DEBUG: ${DEBUG:-false}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  # SMTP gửi OTP đăng nhập sinh viên. Để trống SMTP_HOST → route OTP trả 503
  # (trừ khi DEBUG + OTP_DEV_ECHO).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Eyetracking}
  SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-900}
  OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_MAX_PER_EMAIL_PER_HOUR: ${OTP_MAX_PER_EMAIL_PER_HOUR:-10}
  OTP_MAX_PER_IP_PER_HOUR: ${OTP_MAX_PER_IP_PER_HOUR:-40}
  OTP_ALLOWED_DOMAINS: ${OTP_ALLOWED_DOMAINS:-st.neu.edu.vn}
  # Regex mặc định viết dạng \d lặp 8 lần (tương đương ^\d{8}$) để dấu `}`
  # không đóng sớm cú pháp nội suy `${...:-default}` của Compose.
  OTP_STUDENT_ID_PATTERN: '${OTP_STUDENT_ID_PATTERN:-^\d\d\d\d\d\d\d\d$}'
  OTP_HASH_SECRET: ${OTP_HASH_SECRET:-}
  OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
  MEDIA_DIR: /app/media
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  MAX_PDF_BYTES: ${MAX_PDF_BYTES:-104857600}
  MAX_SLIDE_PAGES: ${MAX_SLIDE_PAGES:-150}
  MAX_SLIDE_RENDER_PIXELS: ${MAX_SLIDE_RENDER_PIXELS:-25000000}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  DB_POOL_MIN: ${DB_POOL_MIN:-4}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  # Profile `pgbouncer` (transaction pooling): đặt biến này =0 trong .env.
  DB_PREPARED_STATEMENT_CACHE_SIZE: ${DB_PREPARED_STATEMENT_CACHE_SIZE:-64}
  GAZE_RETENTION_DAYS: ${GAZE_RETENTION_DAYS:-180}
  # Ngưỡng dwell tối thiểu để một lượt xem được xếp loại "đủ ngưỡng".
  # Mặc định vẫn hiển thị mọi lượt; UI dùng giá trị này cho badge/filter.
  CONTENT_VIEW_MIN_DWELL_MS: ${CONTENT_VIEW_MIN_DWELL_MS:-1000}
  # Frame/giây gaze: backend trả qua GET /api/config, gaze throttle theo FPS.
  GAZE_FPS: ${GAZE_FPS:-15}
  # Chỉ dùng để ghi version calibration; không load weights ở backend.
  UNIGAZE_MODEL: ${UNIGAZE_MODEL:-}
  # Trang Truy vấn CSDL cho admin (chỉ đọc). Để trống → fallback DATABASE_URL
  # ở dev; production nên trỏ tới role admin_reader.
  ADMIN_DB_URL: ${ADMIN_DATABASE_URL_DOCKER:-}
  ADMIN_DB_STATEMENT_TIMEOUT_MS: ${ADMIN_DB_STATEMENT_TIMEOUT_MS:-10000}
  ADMIN_DB_LOCK_TIMEOUT_MS: ${ADMIN_DB_LOCK_TIMEOUT_MS:-2000}
  ADMIN_DB_MAX_ROWS: ${ADMIN_DB_MAX_ROWS:-500}
  ADMIN_DB_SCHEMA_CACHE_SECONDS: ${ADMIN_DB_SCHEMA_CACHE_SECONDS:-60}

# ============================================================
# Stack LOCAL — build toàn bộ image từ source trên máy.
# Không dùng GHCR, không pull_policy, không Portainer.
# Cloudflare Tunnel là tuỳ chọn: điền TUNNEL_TOKEN trong .env thì service
# `cloudflared` tự chạy cùng stack, không phải mở tunnel bằng tay.
#
#   docker compose up -d --build    # build + chạy toàn bộ stack
#   docker compose up -d            # chạy lại (image đã build)
#
# Web: http://localhost:3000 (nginx -> frontend/backend/gaze)
# GPU: chỉ service `gaze`; chatbot embedding chạy CPU + River API.
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: eyetracking-postgres
    restart: unless-stopped
    logging: *default-logging
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - track_io_timing=on
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 4g
    cpus: 4.0

  # PgBouncer tùy chọn cho >4 backend worker hoặc nhiều worker process.
  # Bật bằng: docker compose --profile pgbouncer up -d
  # Sau đó đổi DATABASE_URL_DOCKER host sang pgbouncer:5432.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: eyetracking-pgbouncer
    restart: unless-stopped
    profiles: ["pgbouncer"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "40"
      RESERVE_POOL_SIZE: "10"
      RESERVE_POOL_TIMEOUT: "3"
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    mem_limit: 256m
    cpus: 0.5

  # Chạy migration một lần mỗi lần `docker compose up`. Runner db/migrate.sh
  # dùng bảng `schema_migrations`: chỉ chạy file chưa áp, chặn sửa file đã áp.
  # Service exit 1 ⇒ compose huỷ lần chạy đó; xem `docker logs eyetracking-migrate`.
  migrate:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: eyelearning-migrations:local
    container_name: eyetracking-migrate
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Runner tự tạo/cập nhật role chatbot sau migrations. Phải khớp DSN của
      # service chatbot (CHATBOT_DATABASE_URL_DOCKER).
      CHATBOT_DB_USER: ${CHATBOT_DB_USER:-}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:-}
      # Role chỉ đọc cho trang Truy vấn CSDL của admin.
      ADMIN_DB_USER: ${ADMIN_DB_USER:-}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7.4.11-alpine3.21
    container_name: eyetracking-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - volatile-lru
      - --tcp-keepalive
      - "60"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    image: eyelearning-backend:local
    container_name: eyetracking-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - backend-media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 3g
    cpus: 4.0

  # Test hộp đen backend: image có dev deps, mount tests từ host.
  # Chạy qua scripts/test_backend.sh (profile "test").
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    image: eyelearning-backend-test:local
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eyetracking_test
      REDIS_URL: redis://redis:6379/15
      AI_HTTP_URL: http://gaze:8000
      CHATBOT_URL: http://chatbot:8000
      CHATBOT_INTERNAL_TOKEN: test-internal-token
      CHATBOT_TIMEOUT_SECONDS: "5"
      JWT_SECRET: test-secret-not-for-production-32-bytes-min
      CORS_ORIGINS: http://testserver
      DEBUG: "true"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      TRUSTED_PROXY_IPS: ""
      MEDIA_DIR: /tmp/eyelearning-test-media
      R2_ACCOUNT_ID: ""
      R2_BUCKET_NAME: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_PUBLIC_URL: ""
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
      OTP_DEV_ECHO: "true"
      OTP_HASH_SECRET: test-otp-hash-secret
      OTP_ALLOWED_DOMAINS: st.neu.edu.vn
      OTP_STUDENT_ID_PATTERN: '^\d{8}$'
      OTP_TTL_SECONDS: "600"
      OTP_RESEND_SECONDS: "60"
      OTP_MAX_ATTEMPTS: "5"
      OTP_MAX_PER_EMAIL_PER_HOUR: "5"
      OTP_MAX_PER_IP_PER_HOUR: "20"
      CONTENT_VIEW_MIN_DWELL_MS: "1000"
      GAZE_FPS: "15"
      DB_POOL_MIN: "2"
      DB_POOL_MAX: "6"
      ADMIN_DB_URL: ""
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./backend/pytest.ini:/app/pytest.ini:ro

  # Worker chuyển đổi slide upload (LibreOffice) và tạo các row slides.
  # Image riêng có LibreOffice/fonts; API không cần và không cài.
  content-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: content-worker
    image: eyelearning-backend-content-worker:local
    container_name: eyetracking-content-worker
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["python", "-m", "app.content_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      CONTENT_WORKER_POLL_SECONDS: ${CONTENT_WORKER_POLL_SECONDS:-3}
      CONTENT_WORKER_STALE_SECONDS: ${CONTENT_WORKER_STALE_SECONDS:-600}
      LIBREOFFICE_BINARY: ${LIBREOFFICE_BINARY:-soffice}
      LIBREOFFICE_TIMEOUT_SECONDS: ${LIBREOFFICE_TIMEOUT_SECONDS:-120}
    volumes:
      - backend-media:/app/media
    mem_limit: 4g
    cpus: 2.0

  # Worker phân tích gaze/AOI từ background_jobs(kind=analyze_lesson).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    image: eyelearning-backend:local
    restart: unless-stopped
    logging: *default-logging
    # Analysis dùng SKIP LOCKED nên scale ngang an toàn.
    # Số replica cấu hình qua WORKER_REPLICAS (mặc định 2).
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-600}
    # Worker không mở HTTP; image API có healthcheck /health nên phải tắt.
    healthcheck:
      disable: true
    mem_limit: 1536m
    cpus: 1.0

  # Worker đồng bộ index RAG qua background_jobs(kind=index_slides). Dùng image API
  # (không cần LibreOffice); job nằm trong PostgreSQL nên restart không mất.
  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    image: eyelearning-backend:local
    container_name: eyetracking-embedding-worker
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.embedding_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      EMBEDDING_WORKER_POLL_SECONDS: ${EMBEDDING_WORKER_POLL_SECONDS:-0.5}
      EMBEDDING_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-2}
      EMBEDDING_WORKER_STALE_SECONDS: ${EMBEDDING_WORKER_STALE_SECONDS:-600}
    # Worker không mở HTTP; image API có healthcheck /health nên phải tắt.
    healthcheck:
      disable: true
    mem_limit: 2g
    cpus: 1.0

  # Chatbot RAG: FastAPI + LangChain, embedding local Qwen3-Embedding-0.6B
  # chạy CPU (stage ai-base trong services/chatbot/Dockerfile). LLM/VLM gọi
  # River API. KHÔNG đặt `gpus: all` — GPU chỉ dành cho gaze.
  chatbot:
    build:
      context: ./services/chatbot
      dockerfile: Dockerfile
      target: runtime
    image: eyelearning-chatbot:local
    container_name: eyetracking-chatbot
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CHATBOT_DATABASE_URL: ${CHATBOT_DATABASE_URL_DOCKER}
      CHATBOT_INTERNAL_TOKEN: ${CHATBOT_INTERNAL_TOKEN}
      # Chatbot có pool riêng, không dùng chung DB_POOL_* của backend.
      DB_POOL_MIN: ${CHATBOT_DB_POOL_MIN:-1}
      DB_POOL_MAX: ${CHATBOT_DB_POOL_MAX:-10}
      DB_POOL_TIMEOUT: ${CHATBOT_DB_POOL_TIMEOUT:-10}
      DB_POOL_RECONNECT_TIMEOUT: ${CHATBOT_DB_POOL_RECONNECT_TIMEOUT:-10}
      # Quyết định model local: bắt buộc đặt trong .env, không dùng default.
      EMBEDDING_NAME: ${EMBEDDING_NAME:?Đặt EMBEDDING_NAME=local trong .env}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?Đặt EMBEDDING_DIM=1024 trong .env}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:?Đặt EMBEDDING_MODEL_PATH trong .env}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:?Đặt EMBEDDING_DEVICE=cpu|cuda trong .env}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:?Đặt EMBEDDING_LOCAL_FILES_ONLY=true|false trong .env}
      EMBEDDING_HF_REPO: ${EMBEDDING_HF_REPO:?Đặt EMBEDDING_HF_REPO trong .env}
      HF_TOKEN: ${HF_TOKEN:-}
      # Endpoint LLM/VLM OpenAI-compatible (vLLM, Ollama, OpenRouter, ...).
      LLM_BASE_URL: ${LLM_BASE_URL:?Đặt LLM_BASE_URL trong .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_AUTH_HEADER: ${LLM_AUTH_HEADER-Authorization}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME-Bearer}
      LLM_MODEL: ${LLM_MODEL:?Đặt LLM_MODEL trong .env}
      VLM_MODEL: ${VLM_MODEL:-}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-8192}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-300}
      # Query rewrite + HyDE: tối đa 1 structured call nhỏ mỗi request.
      LLM_QUERY_MAX_TOKENS: ${LLM_QUERY_MAX_TOKENS:-400}
      LLM_QUERY_TIMEOUT: ${LLM_QUERY_TIMEOUT:-3}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-true}
      HYDE_ENABLED: ${HYDE_ENABLED:-true}
      HYDE_MIN_QUERY_WORDS: ${HYDE_MIN_QUERY_WORDS:-8}
      # Answer: một LLM call streaming.
      ANSWER_MAX_TOKENS: ${ANSWER_MAX_TOKENS:-2048}
      ANSWER_TEMPERATURE: ${ANSWER_TEMPERATURE:-0.2}
      # Deprecated: pipeline stream ngay và không retry toàn bộ câu trả lời.
      CITATION_GATE_TOKENS: ${CITATION_GATE_TOKENS:-200}
      CITATION_RETRY_MAX: ${CITATION_RETRY_MAX:-1}
      # Hybrid retrieval: BM25 (Postgres FTS) + dense pgvector + HyDE, fuse RRF.
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_BM25_CANDIDATES: ${RAG_BM25_CANDIDATES:-20}
      RAG_DENSE_CANDIDATES: ${RAG_DENSE_CANDIDATES:-20}
      RAG_HYDE_CANDIDATES: ${RAG_HYDE_CANDIDATES:-20}
      RAG_HYDE_WEIGHT: ${RAG_HYDE_WEIGHT:-0.7}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.2}
      # LMS: regex detection + backend /internal/chat/lms-query.
      LMS_DETECTION_ENABLED: ${LMS_DETECTION_ENABLED:-true}
      CHATBOT_BACKEND_URL: http://backend:8001
      CHATBOT_MAX_CONCURRENT: ${CHATBOT_MAX_CONCURRENT:-6}
      CHATBOT_QUEUE_TIMEOUT: ${CHATBOT_QUEUE_TIMEOUT:-2}
      LLM_GENERATION_CONCURRENCY: ${LLM_GENERATION_CONCURRENCY:-6}
      LLM_TOTAL_CONCURRENCY: ${LLM_TOTAL_CONCURRENCY:-6}
      LLM_REQUESTS_PER_SECOND: ${LLM_REQUESTS_PER_SECOND:-0}
      LLM_ANSWER_TIMEOUT: ${LLM_ANSWER_TIMEOUT:-120}
      VLM_INGEST_CONCURRENCY: ${VLM_INGEST_CONCURRENCY:-4}
      VLM_INGEST_QUEUE_TIMEOUT: ${VLM_INGEST_QUEUE_TIMEOUT:-900}
      # Torch intra-op khớp CPU quota của container (compose cpus: 4).
      EMBEDDING_NUM_THREADS: ${EMBEDDING_NUM_THREADS:-4}
      LLM_QUEUE_TIMEOUT: ${LLM_QUEUE_TIMEOUT:-5}
      LOCAL_MEDIA_DIR: /app/media
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_HTTP_ALLOWED_HOSTS: ${STORAGE_HTTP_ALLOWED_HOSTS:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - backend-media:/app/media:ro
      - chatbot-weights:/app/weights
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    mem_limit: 4g
    cpus: 4.0

  # Gaze cần GPU (NVIDIA driver + nvidia-container-toolkit trên host).
  # Không có GPU: đặt DEVICE=cpu và bỏ `gpus: all` — chạy được nhưng rất chậm.
  # Export UniGaze safetensors -> ONNX vào volume gaze-weights. Chạy một lần rồi
  # Exited (0) như `migrate`; idempotent (manifest khớp sha256 thì bỏ qua). Torch
  # chỉ có ở image này, không có trong image runtime của `gaze`.
  gaze-export:
    build:
      context: ./services/gaze
      dockerfile: Dockerfile
      target: export
    image: eyelearning-gaze-export:local
    restart: "no"
    logging: *default-logging
    environment:
      - DEVICE=${DEVICE:?Đặt DEVICE=cpu|cuda trong .env}
      - UNIGAZE_MODEL=${UNIGAZE_MODEL:?Đặt UNIGAZE_MODEL=unigaze_b16_joint trong .env}
      - OMP_NUM_THREADS=2
      - HF_HUB_OFFLINE=${GAZE_EXPORT_HF_HUB_OFFLINE:-0}
    volumes:
      - gaze-weights:/app/weights
    mem_limit: 4g
    cpus: 2.0

  gaze:
    build:
      context: ./services/gaze
      dockerfile: Dockerfile
      target: runtime
    image: eyelearning-gaze:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gaze-export:
        condition: service_completed_successfully
    # Mặc định 1 replica/GPU + batch nội bộ. Chạy nhiều replica chỉ khi mỗi
    # replica có GPU riêng; nginx dùng cookie gaze_affinity để sticky session.
    deploy:
      replicas: ${GAZE_REPLICAS:-1}
    environment:
      # Quyết định model local: bắt buộc đặt trong .env, không dùng default.
      - DEVICE=${DEVICE:?Đặt DEVICE=cpu|cuda trong .env}
      - UNIGAZE_MODEL=${UNIGAZE_MODEL:?Đặt UNIGAZE_MODEL=unigaze_b16_joint trong .env}
      # Làm mượt One-Euro cho POG (xem services/gaze/app/services/smoothing.py).
      # `beta` cao hơn -> bám nhanh khi lia mắt, bớt trễ.
      - ONEEURO_BETA=${ONEEURO_BETA:-0.5}
      - ONEEURO_MIN_CUTOFF=${ONEEURO_MIN_CUTOFF:-0.5}
      - ONEEURO_D_CUTOFF=${ONEEURO_D_CUTOFF:-1.0}
      # Giới hạn session calibration.
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
      - MAX_SESSIONS=${MAX_SESSIONS:-100}
      - MAX_POINTS=${MAX_POINTS:-64}
      - MAX_SAMPLES_PER_POINT=${MAX_SAMPLES_PER_POINT:-50}
      # Cap thread theo CPU quota (entrypoint.sh cũng set default).
      - OMP_NUM_THREADS=${GAZE_OMP_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${GAZE_OMP_NUM_THREADS:-1}
      - OPENBLAS_NUM_THREADS=${GAZE_OMP_NUM_THREADS:-1}
      - NUMEXPR_NUM_THREADS=${GAZE_OMP_NUM_THREADS:-1}
      # fp16 mặc định cho model đã qua A/B; đặt fp32 để fallback.
      - INFERENCE_PRECISION=${INFERENCE_PRECISION:-fp16}
      - MAX_QUEUE=${GAZE_MAX_QUEUE:-8}
      # Queue GPU đủ sâu để gom batch xuyên session; batch 8 cần queue >= 8.
      - GPU_QUEUE=${GAZE_GPU_QUEUE:-12}
      - GPU_BATCH=${GAZE_GPU_BATCH:-8}
      # Số thread CPU stage (decode + landmarker ONNX); mỗi thread ~1 core.
      - CPU_WORKERS=${GAZE_CPU_WORKERS:-2}
      - FRAME_MAX_AGE_MS=${GAZE_FRAME_MAX_AGE_MS:-200}
      - INFERENCE_TIMEOUT_S=${GAZE_INFERENCE_TIMEOUT_S:-5}
      - MAX_FRAME_BYTES=${GAZE_MAX_FRAME_BYTES:-1048576}
      - GAZE_FPS=${GAZE_FPS:-15}
      # Giới hạn ảnh calibration/import riêng của gaze; không dùng chung
      # MAX_UPLOAD_BYTES (50 MiB) của backend.
      - MAX_UPLOAD_BYTES=${GAZE_MAX_UPLOAD_BYTES:-5242880}
    # Không publish port host: 2 replica sẽ tranh cổng. Truy cập qua nginx
    # /gaze/... hoặc `docker compose exec gaze ...` khi debug.
    expose:
      - "8000"
    volumes:
      - gaze-weights:/app/weights
    gpus: all
    # Healthcheck gọi /ready của gaze (503 khi pipeline chưa load xong; python có
    # sẵn trong image, không dùng curl). start_period dài vì entrypoint tải
    # weights + load landmarker/unigaze ONNX lúc khởi động (có thể > 3 phút).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    mem_limit: 3g
    # 2 thread CPU stage (decode + landmarker ONNX ~4 ms) + GPU thread + event loop:
    # 8 phiên @15 FPS đạt 0% drop với 2 core (benchmarks/baseline/post-landmarker-onnx).
    cpus: 2.0

  # Test hộp đen chatbot: image có dev deps, mount tests từ host.
  chatbot-test:
    build:
      context: ./services/chatbot
      dockerfile: Dockerfile
      target: test
    image: eyelearning-chatbot-test:local
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHATBOT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eyetracking_test
      CHATBOT_INTERNAL_TOKEN: test-internal-token
      DB_POOL_MIN: "1"
      DB_POOL_MAX: "4"
      DB_POOL_TIMEOUT: "5"
      DB_POOL_RECONNECT_TIMEOUT: "2"
      EMBEDDING_NAME: local
      EMBEDDING_DIM: "1024"
      EMBEDDING_MODEL_PATH: /app/weights/Qwen3-Embedding-0.6B
      EMBEDDING_DEVICE: cpu
      EMBEDDING_LOCAL_FILES_ONLY: "true"
      EMBEDDING_HF_REPO: Qwen/Qwen3-Embedding-0.6B
      LLM_BASE_URL: http://llm.invalid/v1
      LLM_API_KEY: test
      LLM_MODEL: test-model
      VLM_MODEL: test-vlm
      LLM_TIMEOUT: "5"
      LLM_QUERY_TIMEOUT: "5"
      LLM_ANSWER_TIMEOUT: "5"
      VLM_TIMEOUT: "5"
      LLM_MAX_RETRIES: "0"
      CHATBOT_BACKEND_URL: http://backend:8001
      LOCAL_MEDIA_DIR: /tmp/eyelearning-chatbot-media
      STORAGE_PROVIDER: local
    volumes:
      - ./services/chatbot/tests:/app/tests:ro
      - ./services/chatbot/pytest.ini:/app/pytest.ini:ro
    command: ["-m", "fast"]

  # Test hộp đen gaze: image có dev deps, mount tests từ host.
  gaze-test:
    build:
      context: ./services/gaze
      dockerfile: Dockerfile
      target: test
    image: eyelearning-gaze-test:local
    profiles: ["test"]
    environment:
      DEVICE: ${DEVICE:-cpu}
      UNIGAZE_MODEL: ${UNIGAZE_MODEL:-unigaze_b16_joint}
      INFERENCE_PRECISION: fp32
      MAX_POINTS: "64"
      MAX_SESSIONS: "100"
      SESSION_TTL_SECONDS: "1800"
      GAZE_FPS: "15"
      MAX_FRAME_BYTES: "1048576"
      MAX_UPLOAD_BYTES: "5242880"
    volumes:
      - ./services/gaze/tests:/app/tests:ro
      - ./services/gaze/pytest.ini:/app/pytest.ini:ro
      - gaze-weights:/app/weights:ro
    command: ["-m", "fast"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL nội bộ cho rewrite phía server (không inlay vào client bundle).
        API_INTERNAL_URL: http://backend:8001
        GAZE_INTERNAL_URL: http://gaze:8000
        # Browser dùng same-origin qua nginx.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_GAZE_URL: ""
    image: eyelearning-frontend:local
    restart: unless-stopped
    logging: *default-logging
    # Các replica chạy sau nginx; static assets đã được nginx cache.
    # Số replica cấu hình qua FRONTEND_REPLICAS (mặc định 2).
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
    healthcheck:
      # 127.0.0.1 thay vì localhost: trong container localhost có thể resolve ::1
      # còn Next.js chỉ listen IPv4 -> healthcheck fail dù web vẫn chạy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: eyelearning-nginx:local
    container_name: eyetracking-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      # CỐ Ý service_started (KHÔNG dùng service_healthy): gaze lỗi/calibration
      # chậm không được chặn nginx/backend — gaze chỉ ảnh hưởng tính năng AI.
      gaze:
        condition: service_started
    mem_limit: 512m
    cpus: 2.0
    volumes:
      # Cho phép nginx phục vụ PDF/slide trực tiếp qua X-Accel-Redirect.
      - backend-media:/media:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Cloudflare Tunnel connector (tuỳ chọn). Chỉ hoạt động khi .env có
  # TUNNEL_TOKEN; thiếu token thì container lỗi và được restart lại, web vẫn
  # chạy bình thường.
  # Dùng host network để giữ nguyên origin http://localhost:3000 (cổng nginx
  # publish trên host) — không phải sửa Public Hostname trong Zero Trust.
  # Metrics pin về loopback: mặc định cloudflared bind 0.0.0.0:20241-20245
  # (kèm /debug/pprof), với host network sẽ lộ ra LAN nếu để mặc định.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    container_name: eyetracking-cloudflared
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
  backend-media:
  gaze-weights:
  chatbot-weights:
  redis-data:
