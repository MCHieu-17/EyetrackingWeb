name: Release

# Build image production và push lên GHCR khi:
#   - push lên main (chỉ image có path thay đổi)
#   - push tag v* (build toàn bộ, tag release)
#   - chạy tay (build toàn bộ)
#
# Sau khi build xong, workflow gọi Portainer webhook (nếu có secret
# PORTAINER_WEBHOOK_URL) và smoke check URL (nếu có repo variable SMOKE_URL).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Plan images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_images: ${{ steps.plan.outputs.has_images }}
      deploy: ${{ steps.plan.outputs.deploy }}
      owner: ${{ steps.vars.outputs.owner }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: vars
        run: |
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          build_all=false
          deploy=false
          changed=""

          if [[ "$EVENT" != "push" || "$REF" != "refs/heads/main" ]]; then
            build_all=true
          elif [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build_all=true
          else
            changed="$(git diff --name-only "$BEFORE" "$SHA")"
            echo "Changed files:"
            echo "$changed"
            if grep -qE '^\.github/workflows/release\.yml$' <<<"$changed"; then
              build_all=true
            fi
            if grep -qE '^deploy/portainer/' <<<"$changed"; then
              deploy=true
            fi
          fi

          backend=false
          content_worker=false
          chatbot=false
          gaze=false
          frontend=false
          nginx=false
          migrations=false

          if [[ "$build_all" == true ]]; then
            backend=true
            content_worker=true
            chatbot=true
            gaze=true
            frontend=true
            nginx=true
            migrations=true
            deploy=true
          else
            grep -qE '^backend/' <<<"$changed" && backend=true || true
            grep -qE '^backend/' <<<"$changed" && content_worker=true || true
            grep -qE '^services/chatbot/' <<<"$changed" && chatbot=true || true
            grep -qE '^services/gaze/' <<<"$changed" && gaze=true || true
            grep -qE '^frontend/' <<<"$changed" && frontend=true || true
            grep -qE '^nginx/' <<<"$changed" && nginx=true || true
            grep -qE '^db/' <<<"$changed" && migrations=true || true
          fi

          matrix='[]'
          if [[ "$backend" == true ]]; then
            matrix=$(jq -c '. + [{"name":"backend","context":"./backend","file":"./backend/Dockerfile","target":"api"}]' <<<"$matrix")
          fi
          if [[ "$content_worker" == true ]]; then
            matrix=$(jq -c '. + [{"name":"content-worker","context":"./backend","file":"./backend/Dockerfile","target":"content-worker"}]' <<<"$matrix")
          fi
          if [[ "$chatbot" == true ]]; then
            matrix=$(jq -c '. + [{"name":"chatbot","context":"./services/chatbot","file":"./services/chatbot/Dockerfile","target":""}]' <<<"$matrix")
          fi
          if [[ "$gaze" == true ]]; then
            matrix=$(jq -c '. + [{"name":"gaze","context":"./services/gaze","file":"./services/gaze/Dockerfile","target":""}]' <<<"$matrix")
          fi
          if [[ "$frontend" == true ]]; then
            matrix=$(jq -c '. + [{"name":"frontend","context":"./frontend","file":"./frontend/Dockerfile","target":""}]' <<<"$matrix")
          fi
          if [[ "$nginx" == true ]]; then
            matrix=$(jq -c '. + [{"name":"nginx","context":"./nginx","file":"./nginx/Dockerfile","target":""}]' <<<"$matrix")
          fi
          if [[ "$migrations" == true ]]; then
            matrix=$(jq -c '. + [{"name":"migrations","context":"./db","file":"./db/Dockerfile","target":""}]' <<<"$matrix")
          fi

          has_images=false
          if [[ "$matrix" != "[]" ]]; then
            has_images=true
          fi
          {
            echo "matrix=$matrix"
            echo "has_images=$has_images"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  build-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Gaze image ~10 GB; runner mặc định có thể hết disk.
      - name: Free disk space (gaze)
        if: matrix.name == 'gaze'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/eyelearning-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_INTERNAL_URL=http://backend:8001
            GAZE_INTERNAL_URL=http://gaze:8000
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_GAZE_URL=
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  notify:
    name: Trigger Portainer + smoke
    runs-on: ubuntu-latest
    needs: [prepare, build-push]
    if: >-
      always() &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') &&
      (needs.prepare.outputs.has_images == 'true' || needs.prepare.outputs.deploy == 'true')
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Trigger Portainer stack webhook
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"

      - name: Bỏ qua webhook (chưa đặt secret)
        if: env.PORTAINER_WEBHOOK_URL == ''
        run: echo "Chưa đặt secrets.PORTAINER_WEBHOOK_URL — bỏ qua trigger Portainer."

      - name: Smoke check sau deploy
        if: vars.SMOKE_URL != ''
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          curl -fsS --retry 30 --retry-delay 15 --retry-connrefused \
            --max-time 10 "$SMOKE_URL"
          echo "Smoke check OK: $SMOKE_URL"

      - name: Bỏ qua smoke check (chưa đặt vars.SMOKE_URL)
        if: vars.SMOKE_URL == ''
        run: echo "Chưa đặt vars.SMOKE_URL — bỏ qua smoke check."
