# ============================================================
# Mẫu override cho LOCAL dev. Sao chép thành docker-compose.override.yml
# (file đó đã gitignore) rồi chỉnh theo máy của bạn:
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Docker Compose v2 tự merge file này với docker-compose.yml khi chạy
# `docker compose up`, nên cấu hình production giữ nguyên.
#
# Mục đích:
#  1) docker-compose.yml KHÔNG publish cổng web/AI/DB ra host (production chỉ vào
#     qua cloudflared/nginx). Máy local mở thẳng để frontend/backend chạy trên
#     host dùng được. Khớp .env:
#       127.0.0.1:3000 -> frontend
#       127.0.0.1:8000 -> gaze     (AI_HTTP_URL)
#       127.0.0.1:8002 -> chatbot  (CHATBOT_URL)
#       127.0.0.1:6379 -> redis    (chỉ dùng nếu .env có REDIS_URL)
#  2) Hạ pull_policy xuống `missing` cho các service build tại chỗ
#     (migrate/gaze/chatbot): dùng image build local nếu có, chỉ pull GHCR khi
#     thiếu. Nếu để `always`, `docker compose up` sẽ kéo image GHCR cũ và ghi đè
#     bản build local.
#
# Nhớ build lại khi sửa db/migrations hoặc services/*:
#   docker compose build migrate gaze chatbot
#   docker compose up -d migrate gaze chatbot
# ============================================================
services:
  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  # Migration: build từ db/migrations local (image GHCR có thể cũ, thiếu file mới).
  migrate:
    pull_policy: missing

  # Gaze service: build từ ./services/gaze, mở 8000 cho host.
  gaze:
    pull_policy: missing
    ports:
      - "127.0.0.1:8000:8000"

  # Chatbot service: build từ ./services/chatbot, mở 8002 cho host.
  chatbot:
    pull_policy: missing
    ports:
      - "127.0.0.1:8002:8000"

  # Redis: mở 6379 cho host (backend host chỉ dùng khi .env có REDIS_URL).
  redis:
    ports:
      - "127.0.0.1:6379:6379"
