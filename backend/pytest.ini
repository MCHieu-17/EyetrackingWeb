[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    fast: test hộp đen không dùng model/LLM thật
    smoke: test dùng model/LLM thật, cần stack/weights
    db: cần PostgreSQL test
    redis: cần Redis test DB
    gpu: cần GPU/weights thật
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
